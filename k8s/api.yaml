apiVersion: apps/v1
kind: Deployment
metadata:
  name: velos-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: velos-api
  template:
    metadata:
      labels:
        app: velos-api
    spec:
      containers:
        - name: api
          image: velos-api:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: velos-secret
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql://velos:$(POSTGRES_PASSWORD)@velos-postgres:5432/velos"
          readinessProbe:
            httpGet:
              path: /sante
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: velos-api
spec:
  type: NodePort
  selector:
    app: velos-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
