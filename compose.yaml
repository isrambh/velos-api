services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: velos
      POSTGRES_USER: velos
      POSTGRES_PASSWORD: velos_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://velos:velos_pass@postgres:5432/velos
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
